# README cards, see https://github.com/pedrocatalao/github-cool-readme
# The action is a fork of the above (v1.6.0 plus count.extraRepos, see cool-readme.yml), pinned to a commit:
# it receives CARDS_TOKEN, so it must not change underneath this repo.
name: Update README cards

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:            # a change to the settings redraws the cards right away
    branches: [main]
    paths: [cool-readme.yml, .github/workflows/cool-readme.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: SakshhamTheCoder/github-cool-readme@006beb0ebde1b1611ff05d314035c75aafd9ce11 # upstream v1.6.0 + count.extraRepos
        with:
          token: ${{ secrets.CARDS_TOKEN }}
          output: ${{ runner.temp }}/cards
      # The cards live on their own branch, as a single commit replaced on each change, so they
      # don't add to the history of the main branch.
      - name: Publish the cards on the cards branch
        run: |
          if ! ls "$RUNNER_TEMP"/cards/*.svg >/dev/null 2>&1; then echo "No cards: they're off"; exit 0; fi
          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true # not there on the first run
          git switch --quiet --orphan cards
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Update README cards'
          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then
            echo "No changes"
            exit 0
          fi
          git push --force origin cards
