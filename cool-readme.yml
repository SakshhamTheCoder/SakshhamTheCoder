user: SakshhamTheCoder

# Two rows of two cards: numbers and languages, then open source and weekly rhythm.
show: [summary, languages, contributions, weekly]

count:
  extraRepos: [Ergane-Foundation/adbt]   # ADBT lives in an organization, so GitHub does not count its stars as mine

look:
  style: classic   # GitHub's own look, follows the viewer's light or dark theme
  color: blue
  border: true

cards:
  summary:
    title: GitHub stats
    ring: github
  languages:
    count: 5       # 5 + "Other" = 6 rows, so the card is the same height as the others
  contributions:
    # Exactly the pinned repos are shown (count = number of pins), so anything else never appears.
    count: 5       # 3 in view at a time, the rest scroll past
    pin:
      - tw93/Mole
      - vitejs/awesome-vite
      - MicrosoftStudentChapter/time-table
      - lamergameryt/AllenVideoDownloader
      - ARNAVVGUPTAA/Qshare
